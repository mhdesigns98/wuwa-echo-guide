# Copy this file to `config.toml` and edit as needed.
# Every setting is optional; anything omitted uses the built-in default.

# ---- Audio capture ----
# The macOS audio input to record. Use the Aggregate Device you create in
# docs/AUDIO_SETUP.md so you capture BOTH your mic and the meeting audio.
# Can be a name substring ("Aggregate") or a numeric index ("2").
# Run `python -m src.devices` to list options.
input_device = "Aggregate Device"
sample_rate = 16000
channels = 1

# ---- Transcription (faster-whisper) ----
# Model size: tiny | base | small | medium | large-v3
#   base   = fast, good enough for clear speech (default)
#   small  = better accuracy, still reasonable on a laptop
#   medium = noticeably better, slower
whisper_model = "base"
whisper_compute_type = "int8"   # int8 (CPU-friendly) | float16 | auto
whisper_device = "auto"          # auto | cpu | cuda
# language = "en"                # uncomment to skip auto-detection

# ---- Summarization (Ollama) ----
ollama_host = "http://localhost:11434"
ollama_model = "llama3.1"        # any model you've `ollama pull`ed
ollama_num_ctx = 8192
chunk_char_size = 9000           # long transcripts are chunked at ~this size

# ---- Output ----
output_dir = "~/MeetingNotes"
open_notes_when_done = true
